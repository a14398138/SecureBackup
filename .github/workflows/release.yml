name: Build signed release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # リポジトリに gradlew がないため、gradle-wrapper.properties と同じバージョンを明示
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow and generate launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 make_icon.py

      - name: Decode keystore
        env:
          KEYSTORE_64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_64" | base64 -d > fullbackup.keystore
          test -s fullbackup.keystore

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk SecureBackup.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: SecureBackup v1.8
          files: SecureBackup.apk
          make_latest: true
