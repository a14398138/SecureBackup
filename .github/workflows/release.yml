name: Build signed release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # リポジトリに gradlew がないため、gradle-wrapper.properties と同じバージョンを明示
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate launcher icons (stdlib only, no pip/Pillow)
        run: python3 make_icon_stdlib.py

      - name: Decode and verify keystore
        env:
          KEYSTORE_64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_64" | tr -d ' \t\r\n"' | base64 -d > fullbackup.keystore
          SIZE=$(stat -c%s fullbackup.keystore)
          echo "keystore decoded: $SIZE bytes"
          if ! keytool -list -keystore fullbackup.keystore -storepass fullbackup > /tmp/kt.log 2>&1; then
            echo "::error::keystore verification failed (size: $SIZE bytes)"
            python3 -c "
            for ln in open('/tmp/kt.log', errors='replace').read().splitlines()[:8]:
                if ln.strip():
                    print('::error::' + ln.strip()[:400])
            "
            exit 1
          fi
          grep -q fullbackup /tmp/kt.log && echo "alias fullbackup: OK" || echo "::warning::alias 'fullbackup' not found in keystore listing"

      - name: Build release APK
        run: |
          if gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            echo "build ok"
          else
            python3 .github/scripts/report_failure.py
            exit 1
          fi

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk SecureBackup.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: SecureBackup v1.8
          files: SecureBackup.apk
          make_latest: true
